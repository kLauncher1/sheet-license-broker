name = "sheet-license-broker-edge"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
ORIGIN_URL = "https://license.yourdomain.com"
HMAC_ENFORCE = "false"
CACHE_TTL_SECONDS = "600"

[[kv_namespaces]]
binding = "LICENSE_KV"
id = "your-kv-namespace-id"
preview_id = "your-preview-kv-namespace-id"
